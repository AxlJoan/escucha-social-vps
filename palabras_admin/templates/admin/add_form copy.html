<!DOCTYPE html>
<html lang="en-us" dir="ltr">
<head>
    <title>Add User | Django Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .help-text {
            font-size: 12px;
            color: #666;
        }
        .submit-row {
            margin-top: 20px;
            text-align: center;
        }
        .submit-row input {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        .submit-row input:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add User</h1>
        <form method="post" id="user_form" novalidate>
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
            
            <label for="id_username">Username:</label>
            <input type="text" name="username" id="id_username" required>
            <div class="help-text">Required. 150 characters or fewer.</div>

            <label for="id_password1">Password:</label>
            <input type="password" name="password1" id="id_password1" required>
            <div class="help-text">At least 8 characters long.</div>
            
            <label for="id_password2">Confirm Password:</label>
            <input type="password" name="password2" id="id_password2" required>
            <div class="help-text">Enter the same password as before.</div>
            
            <div class="submit-row">
                <input type="submit" value="Save">
            </div>
        </form>
    </div>
</body>
</html>
